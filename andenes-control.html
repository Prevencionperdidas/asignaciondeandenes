<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de andenes · CD El Sauce</title>
<style>
:root{--bg:#F2F4F7;--card:#fff;--tx:#14202E;--mut:#5B6776;--line:#D5DBE3;--blue:#0058A3;--yel:#FFDB00;--onyel:#14202E;--ok:#16794C;--okbg:#E2F4EA;--bad:#C62828;--badbg:#FDE7E7;--err:#B3261E;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141C;--card:#18212C;--tx:#EAF0F7;--mut:#9AA7B6;--line:#2C3947;--blue:#4C9BE0;--ok:#5FD69B;--okbg:#12301F;--bad:#FF8A80;--badbg:#3A1A1A;--err:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141C;--card:#18212C;--tx:#EAF0F7;--mut:#9AA7B6;--line:#2C3947;--blue:#4C9BE0;--ok:#5FD69B;--okbg:#12301F;--bad:#FF8A80;--badbg:#3A1A1A;--err:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Verdana,"Segoe UI",system-ui,sans-serif;min-height:100%}
header{background:#0058A3;color:#fff;padding:14px 16px;border-bottom:4px solid var(--yel);display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header small{display:block;font-weight:400;opacity:.85;font-size:.78rem}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 10px;font-size:.8rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:1.15rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px}
input,select{width:100%;padding:13px 12px;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit}
input[type=text]{text-transform:uppercase}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--yel);outline-offset:1px;border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--blue);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;padding:12px 8px;text-align:center;cursor:pointer;font-size:.88rem;color:var(--blue)}
.seg input:checked+label{background:var(--blue);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--yel);outline-offset:-3px}
.err{color:var(--err);font-size:.82rem;min-height:1.1em;margin-top:4px}
.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:var(--yel);color:var(--onyel);font-weight:700;font-size:1.05rem;cursor:pointer;font-family:inherit}
.btn.sec{background:transparent;color:var(--blue);border:1.5px solid var(--blue);margin-top:10px;font-size:.92rem;padding:11px}
.ticket{text-align:center}
.turno{font-size:.9rem;color:var(--mut)}
.big{font-size:3.2rem;font-weight:700;line-height:1.1;margin:6px 0}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--yel);color:var(--onyel)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.anden-box{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:18px;margin:14px 0}
.anden-box .big{color:var(--ok);font-size:4rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:16px 0 0;font-size:.92rem}
dt{color:var(--mut)}dd{margin:0;font-weight:700}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.q{border:1px solid var(--line);border-left:5px solid var(--yel);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--card)}
.q b.t{font-size:1.05rem}
.q .m{color:var(--mut);font-size:.84rem;margin:2px 0 8px}
.q .a{display:flex;gap:8px}
.q select{flex:1;padding:10px}
.q button{padding:10px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.d{border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:92px;background:var(--card)}
.d.free{border-color:var(--ok);background:var(--okbg)}.d.free .st{color:var(--ok)}
.d.busy{border-color:var(--bad);background:var(--badbg)}.d.busy .st{color:var(--bad)}
.d .st{font-weight:700;font-size:.78rem;letter-spacing:.04em}
.d b{font-size:1.2rem}
.d span{display:block;font-size:.78rem;color:var(--mut)}
.d button{margin-top:6px;padding:5px 8px;font-size:.76rem;border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:6px;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar select,.bar input{width:auto;padding:9px 10px;font-size:.88rem}
.bar input{width:80px}
.empty{color:var(--mut);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:8px}
.hide{display:none}
.pill.bad{background:var(--badbg);color:var(--bad)}
.alarma{background:var(--badbg);border:2px solid var(--bad);border-radius:12px;padding:18px;margin:14px 0;color:var(--bad)}
.alarma p{margin:4px 0 0;color:var(--tx)}
.d button[data-c]{background:var(--bad);color:#fff;font-weight:700;width:100%;padding:8px}
.d button.lnk{display:block;border:0;padding:8px 0 0;text-decoration:underline;color:var(--mut)}
.av{color:var(--bad);font-weight:700;font-size:.78rem}
.rc{color:var(--ok);font-weight:700;font-size:.78rem}
.alarma{text-align:left}.alarma .big{text-align:center}
.alarma ol{margin:8px 0;padding-left:22px;color:var(--tx);font-size:.95rem}.alarma li{margin:6px 0}
.recibido{background:var(--okbg);color:var(--ok);border:2px solid var(--ok);border-radius:8px;padding:12px;font-weight:700;text-align:center;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Control de andenes<small>CD El Sauce · Transportes CT</small></h1>
</header>
<main id="app"></main>

<script>
const KEY='andenes_v1', MINE='andenes_mi_id', PIN='2108';
const CTS=['LA SERENA','VALDIVIA','OSORNO','PUERTO MONTT','LOS ÁNGELES','CHILLÁN','TEMUCO','CONCEPCIÓN','CHILE EXPRESS','BLUE EXPRESS','CURICÓ','RANCAGUA','COPIAPÓ','CALAMA','TALCA','COYHAIQUE','ARICA','CORDILLERA','CASTRO','ANTOFAGASTA','VALPARAÍSO'];
const API='https://script.google.com/macros/s/AKfycbwcOvjYE48HpuWj_HPx2oCLJw9yrui-TjgInmkWpyg27jD0kwphiuQOFA1ipkP1gtuu/exec'; // PEGAR AQUÍ la URL de la aplicación web de Apps Script (termina en /exec)
let S={q:[],n:12}, memM=null, unlocked=false, seen=null, last='';
const T=document.title;
function lload(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}return S}
function lsave(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function load(){return S}
function jsonp(p){return new Promise((res,rej)=>{
  const cb='cb'+Date.now()+Math.floor(Math.random()*1e4), sc=document.createElement('script');
  const clean=()=>{clearTimeout(t);delete window[cb];sc.remove()};
  const t=setTimeout(()=>{clean();rej(new Error('tiempo agotado'))},12000);
  window[cb]=d=>{clean();res(d)};
  sc.onerror=()=>{clean();rej(new Error('sin conexión'))};
  sc.src=API+'?'+new URLSearchParams({...p,cb}).toString();document.head.appendChild(sc)})}
async function api(a,d){
  d=d||{};
  if(API){const r=await jsonp({a,d:JSON.stringify(d)});if(r.error)throw new Error(r.error);S={q:r.q,n:r.n};if(r.warn)alert(r.warn);return S}
  const s=lload();
  if(a==='add'){const hoy=new Date().toDateString();s.q.push({...d,turno:s.q.filter(x=>new Date(x.llegada).toDateString()===hoy).length+1,llegada:new Date().toISOString(),estado:'ESPERA',anden:null})}
  else if(a==='upd'){const r=s.q.find(x=>x.id===d.id);if(r){
    if(d.estado==='ASIGNADO'){if(s.q.some(x=>(x.estado==='ASIGNADO'||x.estado==='CULMINADA')&&x.anden===d.anden))alert('Ese andén ya está ocupado.');else{r.estado='ASIGNADO';r.anden=d.anden;r.asignado=new Date().toISOString()}}
    else if(d.estado==='CULMINADA'){r.estado='CULMINADA';r.culminada=new Date().toISOString();r.recibido=null}
    else if(d.recibido){r.recibido=new Date().toISOString()}
    else{r.estado='FINALIZADO';r.liberado=new Date().toISOString()}}}
  else if(a==='cfg')s.n=d.n;
  lsave(s);S=s;return S}
function getMine(){try{return localStorage.getItem(MINE)}catch(e){return memM}}
function setMine(v){memM=v;try{v?localStorage.setItem(MINE,v):localStorage.removeItem(MINE)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hora=iso=>new Date(iso).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
const mins=iso=>Math.max(0,Math.round((Date.now()-new Date(iso))/60000));

function dvRut(b){let s=0,m=2;for(let i=b.length-1;i>=0;i--){s+=+b[i]*m;m=m==7?2:m+1}const r=11-s%11;return r==11?'0':r==10?'K':String(r)}
function fmtRut(v){const c=v.replace(/[^0-9kK]/g,'').toUpperCase();if(c.length<2)return c;const b=c.slice(0,-1);return b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+c.slice(-1)}
function rutOk(v){const c=v.replace(/[^0-9kK]/g,'').toUpperCase();if(c.length<8||c.length>9)return false;return dvRut(c.slice(0,-1))===c.slice(-1)}

/* ---------- Vista panel transporte ---------- */
function viewPanel(){
  if(!unlocked){
    $('#app').innerHTML=`<form class="card" id="pf" style="max-width:360px;margin:0 auto"><h2>Control de andenes</h2><p class="sub">Ingrese el PIN para continuar.</p>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pe"></div>
    <button class="btn" type="submit">Entrar</button></form>`;
    $('#pf').onsubmit=e=>{e.preventDefault();if($('#pin').value===PIN){unlocked=true;render()}else{$('#pe').textContent='PIN incorrecto.';$('#pin').value=''}};
    $('#pin').focus();return;
  }
  const s=load(), hoy=new Date().toDateString();
  const esp=s.q.filter(x=>x.estado==='ESPERA').sort((a,b)=>a.llegada<b.llegada?-1:1);
  const ocup=n=>s.q.find(x=>(x.estado==='ASIGNADO'||x.estado==='CULMINADA')&&x.anden===n);
  const libres=[];for(let i=1;i<=s.n;i++)if(!ocup(i))libres.push(i);
  const fin=s.q.filter(x=>x.estado==='FINALIZADO'&&new Date(x.llegada).toDateString()===hoy).length;
  $('#app').innerHTML=`<div class="bar">
    <b>${esp.length} en espera · ${s.n-libres.length} andenes ocupados · ${fin} finalizados hoy</b>
    <span style="flex:1"></span>
    <label for="nan" style="margin:0;font-weight:400">Andenes</label><input type="number" id="nan" min="1" max="60" value="${s.n}">
    <button class="btn sec" style="width:auto;margin:0" id="csv">Descargar CSV</button></div>
  <div class="grid2">
    <section><h2>Conductores en espera</h2><p class="sub">Orden de llegada.</p>
    ${esp.length?esp.map(r=>`<div class="q"><b class="t">Turno ${r.turno} · ${esc(r.nombres)} ${esc(r.apellidos)}</b>
      <div class="m">${esc(r.region)} · Tractor ${esc(r.tractor)} · Rampla ${esc(r.rampla)}<br>${r.tipoDoc==='CHILENO'?'RUT':'Pasaporte'} ${esc(r.doc)} · llegó ${hora(r.llegada)} (${mins(r.llegada)} min)</div>
      <div class="a"><select aria-label="Andén para turno ${r.turno}" data-s="${r.id}">${libres.length?libres.map(n=>`<option value="${n}">Andén ${n}</option>`).join(''):'<option value="">Sin andenes libres</option>'}</select>
      <button type="button" data-a="${r.id}" ${libres.length?'':'disabled'}>Asignar</button></div></div>`).join('')
    :'<div class="empty">No hay conductores en espera. Los registros nuevos aparecen aquí.</div>'}</section>
    <section><h2>Andenes</h2><p class="sub">Al terminar la carga, avise al conductor y luego libere el andén.</p><div class="dock">
    ${Array.from({length:s.n},(_,i)=>{const o=ocup(i+1);return o?`<div class="d busy"><b>${i+1}</b><span class="st">OCUPADO</span><span>${esc(o.tractor)} / ${esc(o.rampla)}</span><span>CT ${esc(o.region)}</span>${o.estado==='CULMINADA'?`${o.recibido?`<span class="rc">✔ RECIBIDO ${hora(o.recibido)}</span>`:`<span class="av">AVISO ENVIADO · SIN CONFIRMAR</span>`}<button type="button" data-l="${o.id}">Liberar</button>`:`<button type="button" data-c="${o.id}">Carga culminada</button><button type="button" class="lnk" data-l="${o.id}">Liberar sin aviso</button>`}</div>`:`<div class="d free"><b>${i+1}</b><span class="st">LIBRE</span></div>`}).join('')}
    </div></section></div>`;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.a, n=+document.querySelector(`[data-s="${id}"]`).value;
    if(!n)return;b.disabled=true;
    api('upd',{id,estado:'ASIGNADO',anden:n}).then(render).catch(()=>{alert('No se pudo asignar. Revise la conexión.');render()})});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(!confirm('¿Avisar al conductor que su carga culminó? Sonará la alarma en su celular.'))return;b.disabled=true;api('upd',{id:b.dataset.c,estado:'CULMINADA'}).then(render).catch(()=>{alert('No se pudo enviar el aviso. Revise la conexión.');render()})});
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{b.disabled=true;api('upd',{id:b.dataset.l,estado:'FINALIZADO'}).then(render).catch(()=>{alert('No se pudo liberar. Revise la conexión.');render()})});
  $('#nan').onchange=e=>api('cfg',{n:Math.min(60,Math.max(1,+e.target.value||12))}).then(render);
  $('#csv').onclick=()=>{
    const h=['TURNO','NOMBRES','APELLIDOS','TIPO DOC','DOCUMENTO','TRACTOR','RAMPLA','CT','LLEGADA','ESTADO','ANDEN'];
    const rows=s.q.map(r=>[r.turno,r.nombres,r.apellidos,r.tipoDoc,r.doc,r.tractor,r.rampla,r.region,r.llegada,r.estado,r.anden||''].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(','));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.join(','),...rows].join('\n')],{type:'text/csv'}));a.download='andenes.csv';a.click()};
}

/* ---------- Router y sincronización ---------- */
const MODE='control';
function isPanel(){return MODE==='control'}
const sig=()=>JSON.stringify(S)+Math.floor(Date.now()/60000);
function render(){
  last=sig();
  isPanel()?viewPanel():viewConductor();
  if(!API)$('#app').insertAdjacentHTML('afterbegin','<p class="err">Modo local: los registros no se comparten entre dispositivos. Falta pegar la URL de Apps Script en la constante API.</p>');
}
let AC=null, WL=null, memR=null, recSeen=null;
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function tono(f,t0,d){try{unlock();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type='square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.setValueAtTime(0,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function beep(){tono(880,0,.4)}
function alarma(){for(let i=0;i<6;i++)tono(i%2?1100:880,i,.6);navigator.vibrate&&navigator.vibrate([600,400,600,400,600,400,600,400,600,400,600])}
function ringKey(){try{return localStorage.getItem('andenes_ring')}catch(e){return memR}}
function setRing(v){memR=v;try{localStorage.setItem('andenes_ring',v)}catch(e){}}
async function pedirWake(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pedirWake();tick()}});
function alerta(){
  if(!(isPanel()&&unlocked)){seen=null;recSeen=null;return}
  pedirWake();
  const rc=S.q.filter(x=>x.recibido).map(x=>x.id);
  if(recSeen&&rc.some(i=>!recSeen.has(i))){beep();navigator.vibrate&&navigator.vibrate([200,100,200])}
  recSeen=new Set(rc);
  const ids=S.q.filter(x=>x.estado==='ESPERA').map(x=>x.id);
  if(seen&&ids.some(i=>!seen.has(i))){beep();navigator.vibrate&&navigator.vibrate([200,100,200]);document.title='(NUEVO CONDUCTOR) '+T}
  seen=new Set(ids)}
function refresh(){return api('list').then(()=>{alerta();return true}).catch(()=>false)}
function tick(){
  if(document.hidden)return;
  const ant=(S.q.find(x=>x.id===getMine())||{}).estado;
  refresh().then(ok=>{
    if(!ok)return;
    const me=S.q.find(x=>x.id===getMine());
    if(!isPanel()&&me&&ant==='ESPERA'&&me.estado==='ASIGNADO'){navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);beep()}
    if(!isPanel()&&me&&me.estado==='CULMINADA'&&ringKey()!==me.id){setRing(me.id);alarma()}
    const a=document.activeElement;if(a&&a.matches('input,select'))return;
    if(sig()!==last&&(isPanel()&&unlocked||!isPanel()&&me))render()})}
addEventListener('focus',()=>{document.title=T});
setInterval(tick,4000);
refresh().then(render);
</script>
</body>
</html>
