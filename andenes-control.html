<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de andenes · CD El Sauce</title>
<style>
:root{--bg:#F2F4F7;--card:#fff;--tx:#14202E;--mut:#5B6776;--line:#D5DBE3;--blue:#0058A3;--yel:#FFDB00;--onyel:#14202E;--ok:#16794C;--okbg:#E2F4EA;--bad:#C62828;--badbg:#FDE7E7;--err:#B3261E;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141C;--card:#18212C;--tx:#EAF0F7;--mut:#9AA7B6;--line:#2C3947;--blue:#4C9BE0;--ok:#5FD69B;--okbg:#12301F;--bad:#FF8A80;--badbg:#3A1A1A;--err:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141C;--card:#18212C;--tx:#EAF0F7;--mut:#9AA7B6;--line:#2C3947;--blue:#4C9BE0;--ok:#5FD69B;--okbg:#12301F;--bad:#FF8A80;--badbg:#3A1A1A;--err:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Verdana,"Segoe UI",system-ui,sans-serif;min-height:100%}
header{background:#0058A3;color:#fff;padding:14px 16px;border-bottom:4px solid var(--yel);display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header small{display:block;font-weight:400;opacity:.85;font-size:.78rem}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 10px;font-size:.8rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:1.15rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 6px}
input,select{width:100%;padding:13px 12px;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit}
input[type=text]{text-transform:uppercase}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--yel);outline-offset:1px;border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--blue);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{margin:0;padding:12px 8px;text-align:center;cursor:pointer;font-size:.88rem;color:var(--blue)}
.seg input:checked+label{background:var(--blue);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--yel);outline-offset:-3px}
.err{color:var(--err);font-size:.82rem;min-height:1.1em;margin-top:4px}
.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:var(--yel);color:var(--onyel);font-weight:700;font-size:1.05rem;cursor:pointer;font-family:inherit}
.btn.sec{background:transparent;color:var(--blue);border:1.5px solid var(--blue);margin-top:10px;font-size:.92rem;padding:11px}
.ticket{text-align:center}
.turno{font-size:.9rem;color:var(--mut)}
.big{font-size:3.2rem;font-weight:700;line-height:1.1;margin:6px 0}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--yel);color:var(--onyel)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.anden-box{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:18px;margin:14px 0}
.anden-box .big{color:var(--ok);font-size:4rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;margin:16px 0 0;font-size:.92rem}
dt{color:var(--mut)}dd{margin:0;font-weight:700}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.q{border:1px solid var(--line);border-left:5px solid var(--yel);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--card)}
.q b.t{font-size:1.05rem}
.q .m{color:var(--mut);font-size:.84rem;margin:2px 0 8px}
.q .a{display:flex;gap:8px}
.q select{flex:1;padding:10px}
.q button{padding:10px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.dock{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.d{border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:92px;background:var(--card)}
.d.free{border-color:var(--ok);background:var(--okbg)}.d.free .st{color:var(--ok)}
.d.busy{border-color:var(--bad);background:var(--badbg)}.d.busy .st{color:var(--bad)}
.d .st{font-weight:700;font-size:.78rem;letter-spacing:.04em}
.d b{font-size:1.2rem}
.d span{display:block;font-size:.78rem;color:var(--mut)}
.d button{margin-top:6px;padding:5px 8px;font-size:.76rem;border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:6px;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar select,.bar input{width:auto;padding:9px 10px;font-size:.88rem}
.bar input{width:80px}
.empty{color:var(--mut);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:8px}
.scene{position:relative;width:100%;line-height:0;border-radius:8px;overflow:hidden;background:#000}
.scene img{width:100%;display:block}
.door{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}
.door:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.hole{position:absolute;inset:0;opacity:0;overflow:hidden;background:linear-gradient(#1b1f24,#0b0d10 70%,#2a2410);transition:opacity .25s;box-shadow:inset 0 0 8px #000}
.shutter{position:absolute;left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(#8c969e 0 3px,#6f7a83 3px 6px);border-bottom:3px solid #4a535b;transition:height .8s ease-in-out}
.door.show .hole{opacity:1}.door.open .shutter{height:13%}
.truck{position:absolute;left:-16%;width:132%;top:-12%;height:148%;transform:translateY(45%) scale(.8);transform-origin:50% 100%;opacity:0;transition:transform 1s ease,opacity .5s;pointer-events:none}
.door.truck-on .truck{transform:none;opacity:1}
.truck svg{width:100%;height:100%;display:block}
.plate{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);background:#fff;color:#111;border:1px solid #333;border-radius:2px;padding:0 3px;font:700 clamp(6px,1.25vw,11px)/1.3 Verdana,sans-serif;white-space:nowrap}
.tag{position:absolute;left:50%;top:-24%;transform:translateX(-50%);min-width:clamp(14px,2.4vw,24px);height:clamp(14px,2.4vw,24px);border-radius:50%;display:grid;place-items:center;font:700 clamp(8px,1.5vw,14px)/1 Verdana,sans-serif;color:#fff;background:#1a9a4a;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.door.busy .tag{background:#d6372b}
@media(prefers-reduced-motion:reduce){.shutter,.truck,.hole{transition:none}}
.noanim .shutter,.noanim .truck,.noanim .hole{transition:none!important}
.ovl{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.shl{background:var(--card);color:var(--tx);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
@media(min-width:600px){.ovl{align-items:center}.shl{border-radius:16px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:700}
.pick{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:.95rem;cursor:pointer}
.pick small{display:block;color:var(--mut);font-size:.8rem}.pick:hover{border-color:var(--blue)}
.shl .btn{margin-top:10px}
.hide{display:none}
.pill.bad{background:var(--badbg);color:var(--bad)}
.alarma{background:var(--badbg);border:2px solid var(--bad);border-radius:12px;padding:18px;margin:14px 0;color:var(--bad)}
.alarma p{margin:4px 0 0;color:var(--tx)}
.d button[data-c]{background:var(--bad);color:#fff;font-weight:700;width:100%;padding:8px}
.d button.lnk{display:block;border:0;padding:8px 0 0;text-decoration:underline;color:var(--mut)}
.av{color:var(--bad);font-weight:700;font-size:.78rem}
.rc{color:var(--ok);font-weight:700;font-size:.78rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--blue);color:#fff}
.sem{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.3);vertical-align:-1px}
.sem.g{background:#2E9E5B}.sem.y{background:#F2B705}.sem.r{background:#D93025}
.tc{display:block;font-size:.78rem;font-weight:700;margin-top:4px;color:var(--tx)}
.warn{color:var(--bad)}
.leg{font-size:.8rem}.leg .sem{margin-left:10px}.leg .sem:first-child{margin-left:0}
@media (min-width:1024px){
main.wide{max-width:min(1800px,96vw)}
main.wide table{font-size:.92rem}
main.wide th,main.wide td{padding:11px 16px}
main.wide #bq{width:340px!important}
}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg);font-size:.76rem}
.alarma{text-align:left}.alarma .big{text-align:center}
.alarma ol{margin:8px 0;padding-left:22px;color:var(--tx);font-size:.95rem}.alarma li{margin:6px 0}
.recibido{background:var(--okbg);color:var(--ok);border:2px solid var(--ok);border-radius:8px;padding:12px;font-weight:700;text-align:center;margin-top:12px}
.scene3d{position:relative;width:100%;aspect-ratio:2/1;border-radius:8px;overflow:hidden;background:#cfdbe6}
@media(max-width:600px){.scene3d{aspect-ratio:4/3}}
.scene3d canvas{width:100%!important;height:100%!important;display:block}
.s3bar{position:absolute;top:8px;right:8px;display:flex;gap:4px;background:rgba(20,32,46,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px;border-radius:999px}
.s3bar button{border:0;background:transparent;color:#fff;font:700 .72rem Verdana,sans-serif;padding:6px 10px;border-radius:999px;cursor:pointer}
.s3bar button.on{background:#FFDB00;color:#14202E}
.s3hint{position:absolute;left:8px;bottom:8px;background:rgba(20,32,46,.55);color:#fff;font:.7rem Verdana,sans-serif;padding:4px 10px;border-radius:999px;pointer-events:none}
.s3tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:stretch;padding:0;border:0;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.97);box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;font-family:Verdana,sans-serif;white-space:nowrap;min-width:46px}
.s3tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.s3tag b{display:block;padding:2px 6px;color:#fff;font-size:.95rem;text-align:center;background:#1a9a4a}
.s3tag span{display:block;padding:2px 6px 3px;text-align:center;line-height:1.15}
.s3tag strong{display:block;font-size:.62rem;color:#1a9a4a}.s3tag small{display:block;font-size:.58rem;color:#3b4652}
.s3tag.busy b{background:#d6372b}.s3tag.busy strong{color:#d6372b}
.s3tag.late b{background:#9e1c14}.s3tag.late strong{color:#9e1c14}
.s3tag.done b{background:#d98b00}.s3tag.done strong{color:#b06f00}
.s3tag.hov,.s3tag:hover{box-shadow:0 0 0 3px #FFDB00,0 3px 10px rgba(0,0,0,.3);z-index:2}
.s3tag:focus-visible{outline:3px solid #FFDB00}
@media(max-width:700px){.s3tag{min-width:32px;border-radius:6px}.s3tag b{font-size:.72rem;padding:1px 4px}.s3tag strong{font-size:.5rem}.s3tag span{padding:1px 2px 2px}.s3bar button{padding:5px 8px;font-size:.66rem}.s3hint{font-size:.62rem}}
.opLay{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:start}
.opSide{display:flex;flex-direction:column;gap:16px}
.opSide .dock{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.opLay{grid-template-columns:1fr}.opSide .dock{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
header{padding:10px 16px;flex-wrap:wrap}
header .hl{display:flex;align-items:center;gap:14px;min-width:0}
header .hlogo{width:132px;height:132px;flex:none;background:#fff;border-radius:12px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.25);object-fit:contain}
header h1{font-size:1.65rem;line-height:1.2}
header h1 small{font-size:1rem;margin-top:6px}
header .htruck{height:150px;width:auto;max-width:56%;object-fit:cover;object-position:center;border-radius:12px;margin-left:auto;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media (max-width:700px){header .hlogo{width:72px;height:72px}header h1{font-size:1.15rem}header h1 small{font-size:.78rem}
header .htruck{order:3;width:100%;max-width:100%;height:auto;margin:8px 0 2px}}
header .hclock{margin-left:auto;text-align:right;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
header .hclock b{display:block;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
header .hclock span{display:block;font-size:.85rem;opacity:.9}
header .htruck{margin-left:16px}
@media (max-width:700px){header .hclock{order:2;width:100%;margin:8px 0 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 12px;text-align:left}
header .hclock b{font-size:1.35rem}header .hclock span{font-size:.75rem;text-align:right}header .htruck{margin-left:0}}
/* proceso certificador → coordinador */
.ccw{color:#B06F00}
.d.cert{border-color:#D98B00;background:color-mix(in srgb,#F2B705 20%,var(--card));box-shadow:0 0 0 3px rgba(242,183,5,.5);animation:certp 1.6s ease-in-out infinite}
@keyframes certp{50%{box-shadow:0 0 0 7px rgba(242,183,5,.12)}}
.d .cc,.cd .cc{color:var(--ok);font-weight:700;font-size:.8rem}.d .cc small{display:block;font-weight:400;color:var(--mut)}
.d .ec,.cd .ec{font-size:.76rem;font-weight:600;color:var(--mut)}
.certTop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.7fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:12px 16px}
.kpi b{display:block;font-size:2.6rem;line-height:1;color:var(--blue)}.kpi span{font-size:.9rem;color:var(--mut)}
.kpi.ok{border-left-color:var(--ok)}.kpi.ok b{color:var(--ok)}.kpi.am{border-left-color:#D98B00}.kpi.am b{color:#B06F00}
.certLeg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.certLeg small{color:var(--mut);font-size:.78rem}
.certScene{padding:10px}.certScene .scene3d{aspect-ratio:auto;height:min(62vh,760px)}
.certDocks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.cd{background:var(--card);border:1.5px solid var(--line);border-top:7px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.cd b{font-size:1.3rem}.cd span{font-size:.82rem;color:var(--mut)}.cd .tc{font-size:.95rem;color:var(--tx)}
.cd .st{font-weight:700;letter-spacing:.04em;color:var(--blue)}
.cd.free{border-top-color:var(--blue)}.cd.sg{border-top-color:#2E9E5B}.cd.sy{border-top-color:#F2B705}.cd.sr{border-top-color:#D93025}
.cd button{margin-top:auto;padding:13px;border:0;border-radius:8px;background:var(--bad);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
.cd button:disabled{opacity:.6}
.s3count{position:absolute;left:8px;top:8px;background:rgba(20,32,46,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;padding:6px 14px;border-radius:999px;font:700 .82rem Verdana,sans-serif}
.s3count b{color:#8DF0B5;font-size:1.05rem}
.s3tag.free b{background:#0058A3}.s3tag.free strong{color:#0058A3}
.s3tag.sg b{background:#2E9E5B}.s3tag.sg strong{color:#1f7a43}
.s3tag.sy b{background:#F2B705;color:#14202E}.s3tag.sy strong{color:#8a6500}
.s3tag.sr b{background:#D93025}.s3tag.sr strong{color:#B3261E}
.s3tag.cert{box-shadow:0 0 0 3px #FFDB00,0 3px 10px rgba(0,0,0,.3)}.s3tag.cert strong::before{content:"✔ "}
@media (max-width:1000px){.certTop{grid-template-columns:repeat(3,minmax(0,1fr))}.certLeg{grid-column:1/-1}.certDocks{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.certDocks{grid-template-columns:repeat(2,minmax(0,1fr))}.certScene .scene3d{height:auto;aspect-ratio:4/3}.kpi b{font-size:1.8rem}.kpi span{font-size:.75rem}.s3count{font-size:.66rem;top:auto;bottom:34px}}
@media (prefers-reduced-motion:reduce){.d.cert{animation:none}}
</style>
</head>

<script>
const KEY='andenes_v1', MINE='andenes_mi_id', PIN_DEMO='0000'; // solo modo local de prueba; el PIN real se valida en el Apps Script
const PIN_AUTO=''; // ESCRIBA AQUÍ el PIN del Apps Script para entrar directo sin pantalla de PIN (vacío = se pide PIN)
let autoTry=false;
const CTS=['LA SERENA','VALDIVIA','OSORNO','PUERTO MONTT','LOS ÁNGELES','CHILLÁN','TEMUCO','CONCEPCIÓN','CHILE EXPRESS','BLUE EXPRESS','CURICÓ','RANCAGUA','COPIAPÓ','CALAMA','TALCA','COYHAIQUE','ARICA','CORDILLERA','CASTRO','ANTOFAGASTA','VALPARAÍSO'];
const API='https://script.google.com/macros/s/AKfycbwcOvjYE48HpuWj_HPx2oCLJw9yrui-TjgInmkWpyg27jD0kwphiuQOFA1ipkP1gtuu/exec'; // URL de la aplicación web de Apps Script
let S={q:[],n:12}, memM=null, unlocked=false, seen=null, last='', PINV='', avisoMsg='';
const T=document.title;
// Andenes reales del CD (agregar o quitar aquí si cambian)
const ANDENES=[...[1,2,3,4,5,6].map(n=>({id:n,nave:3,lado:'A'})),...[7,8,9].map(n=>({id:n,nave:3,lado:'B'}))];
// Rol: el PC del certificador abre el enlace con #certificador al final
const ROL=(/cert/i.test(location.hash)||/vista=cert/i.test(location.search))?'cert':'coord';
addEventListener('hashchange',()=>location.reload());
const finCarga=r=>r.cert||r.culminada; // fin del SLA de carga: aviso del certificador (o, si no hubo, carga culminada)
const andenLabel=n=>{const a=ANDENES.find(x=>x.id==n);return a?`Nave ${a.nave}, Andén ${a.id}, Lado ${a.lado}`:(n?`Andén ${n}`:'—')};
function lload(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}return S}
function lsave(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function load(){return S}
function jsonp(p){return new Promise((res,rej)=>{
  const cb='cb'+Date.now()+Math.floor(Math.random()*1e4), sc=document.createElement('script');
  const clean=()=>{clearTimeout(t);delete window[cb];sc.remove()};
  const t=setTimeout(()=>{clean();rej(new Error('tiempo agotado'))},12000);
  window[cb]=d=>{clean();res(d)};
  sc.onerror=()=>{clean();rej(new Error('sin conexión'))};
  sc.src=API+'?'+new URLSearchParams({...p,cb}).toString();document.head.appendChild(sc)})}
async function api(a,d){
  d=d||{};
  if(API){if(PINV)d.p=PINV;const r=await jsonp({a,d:JSON.stringify(d)});if(r.error)throw new Error(r.error);S={q:r.q,n:r.n,dupId:r.dupId||null};if(r.warn)alert(r.warn);return S}
  const s=lload();
  let dup=null;
  if(a==='add'){const nd=x=>String(x||'').toUpperCase().replace(/[^0-9A-Z]/g,'');const ex=s.q.find(x=>x.estado!=='FINALIZADO'&&nd(x.doc)===nd(d.doc));if(ex)dup=ex.id;else{const hoy=new Date().toDateString();s.q.push({...d,turno:s.q.filter(x=>new Date(x.llegada).toDateString()===hoy).length+1,llegada:new Date().toISOString(),estado:'ESPERA',anden:null})}}
  else if(a==='cert'){const r=s.q.find(x=>x.id===d.id);if(r&&r.estado==='ASIGNADO'&&!r.cert)r.cert=new Date().toISOString()}
  else if(a==='upd'){const r=s.q.find(x=>x.id===d.id);if(r){
    if(d.estado==='ASIGNADO'){if(s.q.some(x=>(x.estado==='ASIGNADO'||x.estado==='CULMINADA')&&x.anden===d.anden))alert('Ese andén ya está ocupado.');else{r.estado='ASIGNADO';r.anden=d.anden;r.asignado=new Date().toISOString()}}
    else if(d.estado==='CULMINADA'){r.estado='CULMINADA';r.culminada=new Date().toISOString();r.recibido=null}
    else if(d.recibido){r.recibido=new Date().toISOString()}
    else{r.estado='FINALIZADO';r.liberado=new Date().toISOString()}}}
  else if(a==='cfg')s.n=d.n;
  lsave(s);S=s;S.dupId=dup;return S}

function dvRut(b){let s=0,m=2;for(let i=b.length-1;i>=0;i--){s+=+b[i]*m;m=m==7?2:m+1}const r=11-s%11;return r==11?'0':r==10?'K':String(r)}
function fmtRut(v){const c=v.replace(/[^0-9kK]/g,'').toUpperCase();if(c.length<2)return c;const b=c.slice(0,-1);return b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+c.slice(-1)}
function rutOk(v){const c=v.replace(/[^0-9kK]/g,'').toUpperCase();if(c.length<8||c.length>9)return false;return dvRut(c.slice(0,-1))===c.slice(-1)}

/* ---------- Vista panel transporte ---------- */
function viewPanel(){
  if(!unlocked&&!API)unlocked=true; // modo local: sin PIN
  if(!unlocked&&PIN_AUTO&&!autoTry){ // entrada automática con el PIN guardado
    autoTry=true;PINV=PIN_AUTO;$('#app').innerHTML='<div class="empty">Cargando…</div>';
    api('list').then(()=>{unlocked=true;render()}).catch(()=>{PINV='';render()});return}
  if(!unlocked){
    $('#app').innerHTML=`<form class="card" id="pf" style="max-width:360px;margin:0 auto"><h2>Control de andenes</h2><p class="sub">Ingrese el PIN para continuar.</p>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><div class="err" id="pe"></div>
    <button class="btn" type="submit">Entrar</button></form>`;
    $('#pf').onsubmit=e=>{e.preventDefault();const v=$('#pin').value;
      if(!API){if(v===PIN_DEMO){unlocked=true;render()}else{$('#pe').textContent='PIN incorrecto.';$('#pin').value=''}return}
      PINV=v;api('list').then(()=>{unlocked=true;render()}).catch(()=>{PINV='';$('#pe').textContent='PIN incorrecto o sin conexión.';$('#pin').value=''})};
    $('#pin').focus();return;
  }
  $('#app').classList.toggle('wide',true);
  if(ROL==='cert')return viewCert();
  if(tab==='reg')return viewReg();
  const s=load(), hoy=new Date().toDateString();
  const esp=s.q.filter(x=>x.estado==='ESPERA').sort((a,b)=>a.llegada<b.llegada?-1:1);
  const ocup=n=>s.q.find(x=>(x.estado==='ASIGNADO'||x.estado==='CULMINADA')&&x.anden===n);
  const libres=ANDENES.map(a=>a.id).filter(n=>!ocup(n));
  const fin=s.q.filter(x=>x.estado==='FINALIZADO'&&new Date(x.llegada).toDateString()===hoy).length;
  $('#app').innerHTML=`${tabs()}<div class="bar">
    <b>${esp.length} en espera · ${ANDENES.length-libres.length} de ${ANDENES.length} andenes ocupados · ${fin} finalizados hoy${(()=>{const n=s.q.filter(x=>x.estado==='ASIGNADO'&&x.asignado&&!x.cert&&mins(x.asignado)>=UMBRAL).length,nc=s.q.filter(x=>x.estado==='ASIGNADO'&&x.cert).length;return (n?` · <span class="warn">${n} con más de ${UMBRAL} min en carga</span>`:'')+(nc?` · <span class="ccw">${nc} carga(s) culminada(s) por liberar</span>`:'')})()}</b>
    <span style="flex:1"></span>
    
    <button class="btn sec" style="width:auto;margin:0" id="csv">Descargar CSV</button></div>
  <div class="opLay">
  <div class="card opScene" style="padding:14px"><h2>Nave 3 · Lados A y B</h2><p class="sub" style="margin-bottom:10px">Así están los andenes ahora. Toque un andén para asignarlo o ver su detalle.</p><div id="sceneHost"></div></div>
  <div class="opSide">
    <section><h2>Andenes</h2><p class="sub">Cuando el certificador avise carga culminada, avise al conductor y luego libere el andén.</p><div class="dock">
    ${ANDENES.map(a=>{const o=ocup(a.id);return o?`<div class="d busy${o.estado==='ASIGNADO'&&o.cert?' cert':''}"><b>Andén ${a.id}</b><span>Nave ${a.nave}, Lado ${a.lado}</span><span class="st">OCUPADO</span><span>${esc(o.tractor)} / ${esc(o.rampla)}</span><span>CT ${esc(o.region)}</span>${tiempoCarga(o)}${o.estado==='CULMINADA'?`${o.recibido?`<span class="rc">✔ RECIBIDO ${hora(o.recibido)}</span>`:`<span class="av">AVISO ENVIADO · SIN CONFIRMAR</span>`}<button type="button" data-l="${o.id}">Liberar</button>`:`${o.cert?`<span class="cc">✔ CARGA CULMINADA ${hora(o.cert)}<small>Avisó el certificador de carga</small></span>`:`<span class="ec">Esperando aviso del certificador</span>`}<button type="button" data-c="${o.id}">Avisar al conductor</button><button type="button" class="lnk" data-l="${o.id}">Liberar sin aviso</button>`}</div>`:`<div class="d free"><b>Andén ${a.id}</b><span>Nave ${a.nave}, Lado ${a.lado}</span><span class="st">LIBRE</span></div>`}).join('')}
    </div></section>
    <section><h2>Conductores en espera</h2><p class="sub">Orden de llegada.</p>
    ${esp.length?esp.map(r=>`<div class="q"><b class="t">Turno ${r.turno} · ${esc(r.nombres)} ${esc(r.apellidos)}</b>
      <div class="m">${esc(r.region)} · Tractor ${esc(r.tractor)} · Rampla ${esc(r.rampla)}<br>${r.tipoDoc==='CHILENO'?'RUT':'Pasaporte'} ${esc(r.doc)} · llegó ${hora(r.llegada)} (${mins(r.llegada)} min)</div>
      <div class="a"><select aria-label="Andén para turno ${r.turno}" data-s="${r.id}">${libres.length?libres.map(n=>`<option value="${n}">${andenLabel(n)}</option>`).join(''):'<option value="">Sin andenes libres</option>'}</select>
      <button type="button" data-a="${r.id}" ${libres.length?'':'disabled'}>Asignar</button></div></div>`).join('')
    :'<div class="empty">No hay conductores en espera. Los registros nuevos aparecen aquí.</div>'}</section>
  </div></div>`;
  bindTabs();
  mountScene();
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.a, n=+document.querySelector(`[data-s="${id}"]`).value;
    if(!n)return;b.disabled=true;
    api('upd',{id,estado:'ASIGNADO',anden:n}).then(render).catch(()=>{alert('No se pudo asignar. Revise la conexión.');render()})});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(!confirm('¿Avisar al conductor que su carga culminó? Sonará la alarma en su celular.'))return;b.disabled=true;api('upd',{id:b.dataset.c,estado:'CULMINADA'}).then(render).catch(()=>{alert('No se pudo enviar el aviso. Revise la conexión.');render()})});
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{b.disabled=true;api('upd',{id:b.dataset.l,estado:'FINALIZADO'}).then(render).catch(()=>{alert('No se pudo liberar. Revise la conexión.');render()})});
  $('#csv').onclick=()=>{
    const h=['TURNO','NOMBRES','APELLIDOS','TIPO DOC','DOCUMENTO','TRACTOR','RAMPLA','CT','LLEGADA','ESTADO','ANDEN'];
    const rows=s.q.map(r=>[r.turno,r.nombres,r.apellidos,r.tipoDoc,r.doc,r.tractor,r.rampla,r.region,r.llegada,r.estado,r.anden||''].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(','));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.join(','),...rows].join('\n')],{type:'text/csv'}));a.download='andenes.csv';a.click()};
}

  const im=new Image();im.alt='Andenes de la Nave 3, Lado A';im.src=FOTO;sceneEl.appendChild(im);
  ANDENES.forEach((a,i)=>{const p=POS[i];if(!p)return;
    const b=document.createElement('button');b.type='button';b.className='door';b.id='d'+a.id;
    b.setAttribute('aria-label','Nave '+a.nave+', Andén '+a.id+', Lado '+a.lado);
    b.style.cssText='left:'+p[0]+'%;top:'+p[1]+'%;width:'+p[2]+'%;height:'+p[3]+'%';
    b.innerHTML='<div class="hole"><div class="shutter"></div></div><div class="truck">'+TRUCK+'<span class="plate"></span></div><span class="tag">'+a.id+'</span>';
    b.onclick=()=>openDoor(a.id);sceneEl.appendChild(b)});
}
function mountScene(){
  const h=$('#sceneHost');if(!h)return;
  if(window.Dock3D){if(Dock3D.el.parentNode!==h)h.replaceChildren(Dock3D.el);Dock3D.paint();return} // vista 3D
  if(!sceneEl)buildScene();
  h.appendChild(sceneEl);
  paintScene();
}
function paintScene(){
  const first=!Object.keys(scPrev).length;
  ANDENES.forEach(a=>{
    const b=document.getElementById('d'+a.id);if(!b)return;
    const o=ocupante(a.id), busy=!!o;
    b.classList.toggle('busy',busy);
    b.querySelector('.plate').textContent=busy?(o.rampla||o.tractor||''):'';
    if(scPrev[a.id]===busy)return;
    const animate=!first&&scPrev[a.id]!==undefined;
    scPrev[a.id]=busy;
    if(!animate){b.classList.toggle('show',busy);b.classList.toggle('open',busy);b.classList.toggle('truck-on',busy);return}
    if(busy){ // abrir cortina y luego aculatar
      b.classList.add('show');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{b.classList.add('open');setTimeout(()=>b.classList.add('truck-on'),750)}));
    }else{ // retirar camión y luego cerrar cortina
      const had=b.classList.contains('truck-on');b.classList.remove('truck-on');
      setTimeout(()=>{b.classList.remove('open');setTimeout(()=>b.classList.remove('show'),850)},had?1000:0);
    }
  });
  if(first)requestAnimationFrame(()=>requestAnimationFrame(()=>sceneEl.classList.remove('noanim')));
}
function closeOv(){const o=document.getElementById('ovl');if(o)o.remove()}
function sheetOv(html){closeOv();const o=document.createElement('div');o.id='ovl';o.className='ovl';o.innerHTML='<div class="shl" role="dialog" aria-modal="true">'+html+'</div>';o.onclick=e=>{if(e.target===o)closeOv()};document.body.appendChild(o);const x=o.querySelector('#ovx');if(x){x.onclick=closeOv;x.focus()}return o}
function openDoor(n){
  if(ROL==='cert')return openCert(n);
  const o=ocupante(n);
  if(!o){ // andén libre: elegir conductor en espera
    const esp=S.q.filter(x=>x.estado==='ESPERA').sort((a,b)=>a.llegada<b.llegada?-1:1);
    const ov=sheetOv('<h2>'+andenLabel(n)+'</h2><p class="sub" style="margin-bottom:10px">'+(esp.length?'Elija el conductor para este andén:':'Andén libre.')+'</p>'+
      (esp.length?esp.map(r=>'<button type="button" class="pick" data-p="'+r.id+'"><b>Turno '+r.turno+' · '+esc(r.nombres)+' '+esc(r.apellidos)+'</b><small>CT '+esc(r.region)+' · '+esc(r.tractor)+' / '+esc(r.rampla)+' · espera '+mins(r.llegada)+' min</small></button>').join(''):'<div class="empty">No hay conductores en espera.</div>')+
      '<button type="button" class="btn sec" id="ovx">Cerrar</button>');
    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{b.disabled=true;api('upd',{id:b.dataset.p,estado:'ASIGNADO',anden:n}).then(()=>{closeOv();render()}).catch(()=>{alert('No se pudo asignar. Revise la conexión.');closeOv();render()})});
    return}
  const cul=o.estado==='CULMINADA';
  const ov=sheetOv('<h2>'+andenLabel(n)+' · OCUPADO</h2><dl class="kv"><dt>Conductor</dt><dd>'+esc(o.nombres)+' '+esc(o.apellidos)+'</dd><dt>'+(o.tipoDoc==='CHILENO'?'RUT':'Pasaporte')+'</dt><dd>'+esc(o.doc)+'</dd><dt>CT</dt><dd>'+esc(o.region)+'</dd><dt>Tractor / rampla</dt><dd>'+esc(o.tractor)+' / '+esc(o.rampla)+'</dd><dt>Asignado</dt><dd>'+hm(o.asignado)+' ('+fmtDur(mins(o.asignado))+')</dd><dt>Estado</dt><dd>'+(cul?(o.recibido?'Carga finalizada · ✔ recibido '+hm(o.recibido):'Carga finalizada · aviso sin confirmar'):o.cert?'✔ Carga culminada '+hm(o.cert)+' (avisó el certificador) · falta avisar al conductor':'En carga · esperando aviso del certificador')+'</dd></dl>'+
    (cul?'<button type="button" class="btn" id="ovl1">Liberar andén</button>':'<button type="button" class="btn" id="ovc" style="background:var(--bad);color:#fff">Avisar al conductor</button><button type="button" class="btn sec" id="ovl1">Liberar sin aviso</button>')+
    '<button type="button" class="btn sec" id="ovx">Cerrar</button>');
  const go=(est,msg)=>{api('upd',{id:o.id,estado:est}).then(()=>{closeOv();render()}).catch(()=>{alert(msg);closeOv();render()})};
  const c1=ov.querySelector('#ovc');if(c1)c1.onclick=()=>{if(confirm('¿Avisar al conductor que su carga culminó? Sonará la alarma en su celular.')){c1.disabled=true;go('CULMINADA','No se pudo enviar el aviso. Revise la conexión.')}};
  ov.querySelector('#ovl1').onclick=e=>{e.target.disabled=true;go('FINALIZADO','No se pudo liberar. Revise la conexión.')};
}

const mCarga=o=>{const f=finCarga(o);return f?dur(o.asignado,f):(o.asignado?mins(o.asignado):0)};
function viewCert(){
  const s=load();
  const ocup=n=>s.q.find(x=>(x.estado==='ASIGNADO'||x.estado==='CULMINADA')&&x.anden===n);
  const libres=ANDENES.filter(a=>!ocup(a.id)).length;
  const enc=s.q.filter(x=>x.estado==='ASIGNADO'&&!x.cert).length;
  const xl=s.q.filter(x=>(x.estado==='ASIGNADO'&&x.cert)||x.estado==='CULMINADA').length;
  $('#app').innerHTML=`<div class="certTop">
    <div class="kpi ok"><b>${libres}</b><span>de ${ANDENES.length} andenes disponibles</span></div>
    <div class="kpi"><b>${enc}</b><span>andenes en carga</span></div>
    <div class="kpi am"><b>${xl}</b><span>carga culminada · por liberar</span></div>
    <div class="certLeg"><b>Semáforo SLA de carga</b><span class="leg"><i class="sem g"></i>menos de ${UMBRAL} min<i class="sem y"></i>${UMBRAL} a ${UMBRAL*2-1} min<i class="sem r"></i>${UMBRAL*2} min o más</span><small>Vista certificador de carga · al terminar, presione Carga culminada y el coordinador de transporte liberará el andén.</small></div></div>
  <div class="card certScene"><div id="sceneHost"></div></div>
  <div class="certDocks">${[...ANDENES].reverse().map(a=>certCard(a,ocup(a.id))).join('')}</div>`;
  mountScene();
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>certificar(b.dataset.k,+b.dataset.n,b));
}
function certCard(a,o){
  if(!o)return `<div class="cd free"><b>Andén ${a.id}</b><span class="st">DISPONIBLE</span><span>Nave ${a.nave}, Lado ${a.lado}</span></div>`;
  const f=finCarga(o),m=mCarga(o);
  const sem=`<span class="tc"><i class="sem ${semaf(m)}"></i>${fmtDur(m)} ${f?'de carga':'en carga'}</span>`;
  const inf=`<span>${esc(o.tractor)} / ${esc(o.rampla)} · CT ${esc(o.region)}</span>`;
  if(o.estado==='ASIGNADO'&&!o.cert)return `<div class="cd s${semaf(m)}"><b>Andén ${a.id}</b>${sem}${inf}<button type="button" data-k="${o.id}" data-n="${a.id}">Carga culminada</button></div>`;
  return `<div class="cd done s${semaf(m)}"><b>Andén ${a.id}</b>${sem}${inf}<span class="cc">✔ Carga culminada ${f?hora(f):''}</span><span class="ec">${o.estado==='CULMINADA'?'Conductor avisado · esperando liberación':'Coordinador avisado · esperando liberación'}</span></div>`}
function certificar(id,n,b){
  if(!confirm('¿Confirmar CARGA CULMINADA en '+andenLabel(n)+'?\nSe avisará al coordinador de transporte para que libere el andén.'))return;
  if(b)b.disabled=true;
  api('cert',{id}).then(()=>{const r=S.q.find(x=>x.id===id);if(r&&r.estado==='ASIGNADO'&&!r.cert)alert('El aviso no quedó registrado: falta actualizar el Apps Script con la acción del certificador.');closeOv();render()})
    .catch(()=>{alert('No se pudo avisar al coordinador. Revise la conexión.');closeOv();render()})}
function openCert(n){
  const o=ocupante(n);
  if(!o){sheetOv('<h2>'+andenLabel(n)+'</h2><p class="sub">Andén disponible.</p><button type="button" class="btn sec" id="ovx">Cerrar</button>');return}
  const f=finCarga(o),m=mCarga(o),pend=o.estado==='ASIGNADO'&&!o.cert;
  const ov=sheetOv('<h2>'+andenLabel(n)+'</h2><dl class="kv"><dt>Conductor</dt><dd>'+esc(o.nombres)+' '+esc(o.apellidos)+'</dd><dt>CT</dt><dd>'+esc(o.region)+'</dd><dt>Tractor / rampla</dt><dd>'+esc(o.tractor)+' / '+esc(o.rampla)+'</dd><dt>Asignado</dt><dd>'+hm(o.asignado)+'</dd><dt>SLA carga</dt><dd><i class="sem '+semaf(m)+'"></i>'+fmtDur(m)+' · '+semT(m)+'</dd><dt>Estado</dt><dd>'+(pend?'En carga':'✔ Carga culminada '+hm(f)+' · esperando liberación del coordinador')+'</dd></dl>'+
    (pend?'<button type="button" class="btn" id="ovk" style="background:var(--bad);color:#fff">Carga culminada</button>':'')+'<button type="button" class="btn sec" id="ovx">Cerrar</button>');
  const k=ov.querySelector('#ovk');if(k)k.onclick=()=>certificar(o.id,n,k)}

let tab='op', regRows=[], rf={d1:'',d2:'',q:''}, memAl={};
const UMBRAL=30; // minutos: verde < 30, amarillo 30-59, rojo 60 o más; la alerta suena cada 30 min
const semaf=m=>m<UMBRAL?'g':m<UMBRAL*2?'y':'r';
const semT=m=>m<UMBRAL?'Dentro del tiempo':m<UMBRAL*2?'Atención':'Crítico';
function slaCarga(r){
  let m=dur(r.asignado,finCarga(r)),enc=false;
  if(m==null&&r.estado==='ASIGNADO'&&r.asignado){m=mins(r.asignado);enc=true}
  if(m==null)return '—';
  return `<i class="sem ${semaf(m)}" title="${semT(m)}"></i>${fmtDur(m)}${enc?' (en curso)':''}`}
function semCsv(r){const m=dur(r.asignado,finCarga(r));return m==null?'':m<UMBRAL?'VERDE':m<UMBRAL*2?'AMARILLO':'ROJO'}
function tiempoCarga(o){
  if(finCarga(o)){const m=dur(o.asignado,finCarga(o));return m==null?'':`<span class="tc"><i class="sem ${semaf(m)}"></i>Carga: ${fmtDur(m)}</span>`}
  if(!o.asignado)return '';
  const m=mins(o.asignado);return `<span class="tc ${m>=UMBRAL?'warn':''}"><i class="sem ${semaf(m)}"></i>${fmtDur(m)} en carga</span>`}
function alGet(){try{return JSON.parse(localStorage.getItem('andenes_alertas'))||{}}catch(e){return memAl}}
function alSet(o){memAl=o;try{localStorage.setItem('andenes_alertas',JSON.stringify(o))}catch(e){}}
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=(i,sec)=>i?new Date(i).toLocaleTimeString('es-CL',sec?{hour:'2-digit',minute:'2-digit',second:'2-digit'}:{hour:'2-digit',minute:'2-digit'}):'';
const dur=(a,b)=>{if(!a||!b)return null;const m=Math.round((new Date(b)-new Date(a))/60000);return m<0?null:m};
const dm=(a,b)=>{const m=dur(a,b);return m==null?'':m};
const fmtDur=m=>m==null?'':m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
const fch=i=>i?new Date(i).toLocaleDateString('es-CL'):'';
const EST={ESPERA:'EN ESPERA',ASIGNADO:'EN CARGA',CULMINADA:'CARGA FINALIZADA',FINALIZADO:'CERRADO'};
function tabs(){const n=S.q.filter(x=>x.estado==='ESPERA').length;
  return `<div class="tabs"><button type="button" data-t="op" class="${tab==='op'?'on':''}">Operación <span id="bd">${n?'('+n+' en espera)':''}</span></button><button type="button" data-t="reg" class="${tab==='reg'?'on':''}">Registros</button></div>`}
function bindTabs(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function filtReg(){const q=rf.q.trim().toUpperCase();return regRows.filter(r=>!q||[r.nombres,r.apellidos,r.doc,r.tractor,r.rampla].join(' ').toUpperCase().includes(q)).sort((a,b)=>a.llegada<b.llegada?1:-1)}
function pintaReg(){
  const t=$('#rtab');if(!t)return;const rows=filtReg();
  const avg=f=>{const v=rows.map(f).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  t.innerHTML=rows.length?`<p class="sub">${rows.length} registro(s) · Promedio SLA Asignación: <b>${fmtDur(avg(r=>dur(r.llegada,r.asignado)))||'—'}</b> · Promedio SLA Carga: <b>${fmtDur(avg(r=>dur(r.asignado,finCarga(r))))||'—'}</b><br><span class="leg">Semáforo SLA Carga: <i class="sem g"></i>menos de ${UMBRAL} min<i class="sem y"></i>${UMBRAL} a ${UMBRAL*2-1} min<i class="sem r"></i>${UMBRAL*2} min o más</span></p><div class="tw"><table><thead><tr><th>Fecha</th><th>Nombres</th><th>Apellidos</th><th>RUT / Doc.</th><th>PPU tractor</th><th>PPU rampla</th><th>CT</th><th>Andén</th><th>Hora registro</th><th>Hora asignación</th><th>Hora carga finalizada</th><th>Hora cierre</th><th>Estado</th><th>SLA Asignación</th><th>SLA Carga</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fch(r.llegada)}</td><td>${esc(r.nombres)}</td><td>${esc(r.apellidos)}</td><td>${esc(r.doc)}</td><td>${esc(r.tractor)}</td><td>${esc(r.rampla)}</td><td>${esc(r.region)}</td><td>${r.anden?andenLabel(r.anden):'—'}</td><td>${hm(r.llegada)||'—'}</td><td>${hm(r.asignado)||'—'}</td><td>${hm(finCarga(r))||'—'}</td><td>${hm(r.liberado)||'—'}</td><td>${EST[r.estado]||esc(r.estado)}</td><td>${fmtDur(dur(r.llegada,r.asignado))||'—'}</td><td>${slaCarga(r)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay registros en ese rango.</div>'}
async function cargarReg(){
  try{
    if(API){const r=await jsonp({a:'hist',d:JSON.stringify({desde:rf.d1,hasta:rf.d2,p:PINV})});if(r.error)throw new Error(r.error);regRows=r.q}
    else regRows=lload().q.filter(x=>{const d=ymd(x.llegada);return d>=rf.d1&&d<=rf.d2});
    pintaReg();
  }catch(e){const t=$('#rtab');if(t)t.innerHTML='<div class="empty">No se pudo cargar. Revise la conexión y pulse Consultar.</div>'}}
function viewReg(){
  if(!rf.d1){rf.d1=rf.d2=ymd(Date.now())}
  $('#app').innerHTML=`${tabs()}<div class="bar">
    <label for="d1" style="margin:0;font-weight:400">Desde</label><input type="date" id="d1" value="${rf.d1}" style="width:150px">
    <label for="d2" style="margin:0;font-weight:400">Hasta</label><input type="date" id="d2" value="${rf.d2}" style="width:150px">
    <input type="search" id="bq" aria-label="Buscar" placeholder="Buscar nombre, RUT o patente" value="${esc(rf.q)}" style="width:230px">
    <button class="btn sec" style="width:auto;margin:0" id="bgo" type="button">Consultar</button>
    <span style="flex:1"></span><button class="btn sec" style="width:auto;margin:0" id="bcsv" type="button">Descargar CSV</button></div>
    <div id="rtab"><div class="empty">Cargando…</div></div>`;
  bindTabs();
  $('#bgo').onclick=()=>{rf.d1=$('#d1').value||ymd(Date.now());rf.d2=$('#d2').value||rf.d1;rf.q=$('#bq').value;cargarReg()};
  $('#bq').oninput=()=>{rf.q=$('#bq').value;pintaReg()};
  $('#bcsv').onclick=()=>{
    const h=['FECHA','NOMBRES','APELLIDOS','TIPO DOC','RUT / DOCUMENTO','PPU TRACTOR','PPU RAMPLA','CT','ANDÉN','HORA REGISTRO','HORA ASIGNACIÓN','HORA CARGA FINALIZADA','HORA CIERRE','ESTADO','SLA ASIGNACIÓN (MIN)','SLA CARGA (MIN)','SEMÁFORO SLA CARGA'];
    const rows=filtReg().map(r=>[fch(r.llegada),r.nombres,r.apellidos,r.tipoDoc,r.doc,r.tractor,r.rampla,r.region,r.anden?andenLabel(r.anden):'',hm(r.llegada,1),hm(r.asignado,1),hm(finCarga(r),1),hm(r.liberado,1),EST[r.estado]||r.estado,dm(r.llegada,r.asignado),dm(r.asignado,finCarga(r)),semCsv(r)].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(','));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.join(','),...rows].join('\n')],{type:'text/csv'}));a.download='registros-andenes-'+rf.d1+'_'+rf.d2+'.csv';a.click()};
  cargarReg();
}

const MODE='control';
function isPanel(){return MODE==='control'}
const sig=()=>JSON.stringify(S)+Math.floor(Date.now()/60000);
function render(){
  last=sig();
  isPanel()?viewPanel():viewConductor();
  if(!API)$('#app').insertAdjacentHTML('afterbegin','<p class="err">Modo local: los registros no se comparten entre dispositivos. Falta pegar la URL de Apps Script en la constante API.</p>');
}
let AC=null, WL=null, memR=null, recSeen=null, certSeen=null;
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function tono(f,t0,d){try{unlock();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type='square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.setValueAtTime(0,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function beep(){tono(880,0,.4)}
function alarma(){for(let i=0;i<6;i++)tono(i%2?1100:880,i,.6);navigator.vibrate&&navigator.vibrate([600,400,600,400,600,400,600,400,600,400,600])}
function ringKey(){try{return localStorage.getItem('andenes_ring')}catch(e){return memR}}
function setRing(v){memR=v;try{localStorage.setItem('andenes_ring',v)}catch(e){}}
async function pedirWake(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pedirWake();tick()}});
function alerta(){
  if(!(isPanel()&&unlocked)){seen=null;recSeen=null;certSeen=null;return}
  pedirWake();
  const rc=S.q.filter(x=>x.recibido).map(x=>x.id);
  if(ROL==='coord'&&recSeen&&rc.some(i=>!recSeen.has(i))){beep();navigator.vibrate&&navigator.vibrate([200,100,200])}
  recSeen=new Set(rc);
  const al=alGet();let sonar=false;
  S.q.filter(x=>x.estado==='ASIGNADO'&&x.asignado&&!x.cert).forEach(x=>{const k=Math.floor(mins(x.asignado)/UMBRAL);if(k>=1&&(al[x.id]||0)<k){al[x.id]=k;sonar=true}});
  if(sonar){alSet(al);tono(660,0,.25);tono(660,.4,.25);tono(660,.8,.25);navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);document.title='(ALERTA CARGA) '+T}
  const ids=S.q.filter(x=>x.estado==='ESPERA').map(x=>x.id);
  if(ROL==='coord'&&seen&&ids.some(i=>!seen.has(i))){beep();navigator.vibrate&&navigator.vibrate([200,100,200]);document.title='(NUEVO CONDUCTOR) '+T}
  seen=new Set(ids);
  const ce=S.q.filter(x=>x.estado==='ASIGNADO'&&x.cert).map(x=>x.id); // aviso del certificador al coordinador
  if(ROL==='coord'&&certSeen&&ce.some(i=>!certSeen.has(i))){for(let i=0;i<3;i++){tono(1046,i*.6,.22);tono(1318,i*.6+.25,.25)}navigator.vibrate&&navigator.vibrate([250,120,250,120,250]);document.title='(CARGA CULMINADA) '+T}
  certSeen=new Set(ce)}
function refresh(){return api('list').then(()=>{alerta();return true}).catch(()=>false)}
function tick(){
  if(document.hidden)return;
  const ant=(S.q.find(x=>x.id===getMine())||{}).estado;
  refresh().then(ok=>{
    if(!ok)return;
    const me=S.q.find(x=>x.id===getMine());
    if(!isPanel()&&me&&ant==='ESPERA'&&me.estado==='ASIGNADO'){navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);beep()}
    if(!isPanel()&&me&&me.estado==='CULMINADA'&&ringKey()!==me.id){setRing(me.id);alarma()}
    const a=document.activeElement;if(a&&a.matches('input,select'))return;
    if(isPanel()&&unlocked&&tab==='reg'){const bd=$('#bd'),n=S.q.filter(x=>x.estado==='ESPERA').length;if(bd)bd.textContent=n?'('+n+' en espera)':''}else if(sig()!==last&&(isPanel()&&unlocked||!isPanel()&&me))render()})}

  wheelSet(g,16.8,[-1.05,1.05],.52,.38,wheels);
  const cab=new THREE.Mesh(new RoundedBoxGeometry(2.5,2.75,2.4,3,.14),paint);cab.position.set(0,2.55,16.9);cab.castShadow=true;g.add(cab);
  const fair=new THREE.Mesh(new RoundedBoxGeometry(2.4,.7,1.7,2,.12),paint);fair.position.set(0,4.15,16.6);fair.rotation.x=.12;fair.castShadow=true;g.add(fair);
  box(2.2,.06,.04,M({color:0x111}),0,3.35,18.11,g,false);
  const ws=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.05),gl);ws.position.set(0,3.3,18.105);g.add(ws);
  for(const sx of [-1,1]){const sw=new THREE.Mesh(new THREE.PlaneGeometry(1,.8),gl);sw.position.set(sx*1.255,3.3,17.4);sw.rotation.y=sx*Math.PI/2;g.add(sw)}
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.95),M({map:T.grille,roughness:.4,metalness:.5}));gr.position.set(0,2.05,18.105);g.add(gr);
  const hl=M({color:0xffffff,emissive:0xfff6d8,emissiveIntensity:.6});
  box(.42,.18,.05,hl,-.92,1.75,18.11,g,false);box(.42,.18,.05,hl,.92,1.75,18.11,g,false);
  box(2.6,.42,.32,M({color:0x3a3f44,metalness:.6,roughness:.35}),0,1.22,18.2,g);
  for(const sx of [-1,1]){box(.08,.5,.12,chassisM,sx*1.42,3.35,17.95,g);const ft=cyl(.32,1.3,hubM,g,18);ft.rotation.x=Math.PI/2;ft.position.set(sx*1.02,.95,15.1);
    const ex=cyl(.07,1.6,hubM,g,10);ex.position.set(sx*1.1,4.1,15.6)}
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.56,.16),new THREE.MeshBasicMaterial({map:plateTex(seed)}));pl.position.set(0,1.22,18.37);g.add(pl);g.userData.plate=pl;
  g.traverse(o=>{if(o.isMesh)o.userData.truck=true});
  scene.add(g);return g}

/* ---------- animación ---------- */
const tweens=new Set();let dirty=true;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tween(ms,fn){if(RM||ms<=0){fn(1);return Promise.resolve()}return new Promise(r=>tweens.add({t0:performance.now(),ms,fn,r}))}
function setShutter(d,k){const s=1-.9*k;d.sh.scale.y=s;d.sh.position.y=DOCK_Y+DOOR_H-DOOR_H*s/2;dirty=true}
// trayectoria de retroceso (curva Bézier del eje trasero): entra de lado y se alinea
function pathAt(d,t){const s=d.lx<(d.lado==='B'?-TARGET_B.x:TARGET.x)?-1:1,u=1-t;
  const P=[[d.lx+34*s,30],[d.lx+8*s,30],[d.lx,32],[d.lx,.45]];
  const p=i=>u*u*u*P[0][i]+3*u*u*t*P[1][i]+3*u*t*t*P[2][i]+t*t*t*P[3][i];
  const q=i=>3*(u*u*(P[1][i]-P[0][i])+2*u*t*(P[2][i]-P[1][i])+t*t*(P[3][i]-P[2][i]));
  return {x:p(0),z:p(1),dx:q(0),dz:q(1)}}
function placeTruck(d,t){const tr=d.truck,a=pathAt(d,Math.min(t,.9999)),b=pathAt(d,t);
  const ox=tr.position.x,oz=tr.position.z;tr.position.set(b.x,0,b.z);
  const L=Math.hypot(a.dx,a.dz)||1;tr.rotation.y=Math.atan2(-a.dx/L,-a.dz/L);
  const dist=Math.hypot(b.x-ox,b.z-oz);tr.userData.wheels.forEach(w=>w.rotation.x+=dist/.52);dirty=true}
function setSem(d,c){d.red.emissiveIntensity=c==='r'?3.5:0;d.amb.emissiveIntensity=c==='y'?3.5:0;d.grn.emissiveIntensity=c==='g'?3.5:0;dirty=true}
const semOf=o=>o?semaf(mCarga(o)):'off';
function truckFor(d,seed){const t=makeTruck(seed);d.parent.add(t);return t} // el camión vive en el grupo de su lado
async function arrive(d,o){
  if(!d.truck)d.truck=truckFor(d,o.tractor||o.rampla||d.n);
  d.truck.userData.plate.material.map=plateTex(o.tractor||'');d.truck.visible=true;
  setSem(d,semOf(o));placeTruck(d,0);
  await tween(900,k=>setShutter(d,ease(k)));
  d.moving=true;await tween(4600,k=>placeTruck(d,ease(k)));d.moving=false;
  d.truck.userData.amber.emissiveIntensity=.4}
async function leave(d){
  if(d.truck){d.moving=true;await tween(3800,k=>placeTruck(d,1-ease(k)));d.moving=false;d.truck.visible=false}
  await tween(900,k=>setShutter(d,1-ease(k)));setSem(d,'off')}
async function drive(d){if(d.running)return;d.running=true;
  try{while(d.shown!==d.target){const want=d.target;if(want)await arrive(d,ocupante(d.n)||{});else await leave(d);d.shown=want}}
  finally{d.running=false}}

/* ---------- etiquetas ---------- */
function drawTag(d,o){
  const busy=!!o,f=busy&&finCarga(o),m=busy?mCarga(o):0;
  const cls=!busy?'free':'s'+semaf(m)+(f?' cert':'');
  const st=!busy?'LIBRE':f?(o.estado==='CULMINADA'?(o.recibido?'RECIBIDO':'AVISADO'):'CULMINADA'):(m<60?m+' min':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0'));
  const sub=busy?(o.rampla||''):'';
  const key=cls+st+sub+el.clientWidth;if(key===d.txt)return;d.txt=key;
  d.tag.className='s3tag '+cls;
  d.tag.title=busy?('Rampla '+(o.rampla||'—')+' · Tractor '+(o.tractor||'—')+' · CT '+(o.region||'')+' · SLA carga '+fmtDur(m)):'Andén disponible';
  d.tag.setAttribute('aria-label',andenLabel(d.n)+': '+(busy?(f?'carga culminada':'en carga '+fmtDur(m))+', semáforo '+semT(m):'disponible'));
  d.tag.innerHTML='<b>'+d.n+'</b><span><strong>'+esc(st)+'</strong>'+(sub&&el.clientWidth>700?'<small>'+esc(sub)+'</small>':'')+'</span>';
  dirty=true}
const vtmp=new THREE.Vector3(),occRay=new THREE.Raycaster(),occDir=new THREE.Vector3();
const occluders=[body,r1,r2];
function hiddenByNave(p){occDir.subVectors(p,camera.position);const dist=occDir.length();occDir.divideScalar(dist);
  occRay.set(camera.position,occDir);occRay.far=dist-.5;return occRay.intersectObjects(occluders,false).length>0}
function placeTags(){const w=el.clientWidth,h=el.clientHeight;
  docks.forEach(d=>{vtmp.copy(d.anchor).project(camera);const vis=vtmp.z<1&&!hiddenByNave(d.anchor);
    d.tag.style.display=vis?'':'none';if(vis)d.tag.style.transform=`translate(${((vtmp.x+1)/2*w).toFixed(1)}px,${((1-vtmp.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`})}
function paint(){
  const lib=docks.filter(d=>!ocupante(d.n)).length;cnt.innerHTML='<b>'+lib+'</b> de '+docks.length+' andenes disponibles';
  docks.forEach(d=>{const o=ocupante(d.n),busy=!!o;drawTag(d,o);d.target=busy;if(busy)setSem(d,semOf(o));else if(!d.running)setSem(d,'off');
    if(d.shown===undefined){ // primera vez: sin animación
      d.shown=busy;setShutter(d,busy?1:0);
      if(busy){d.truck=truckFor(d,o.tractor||o.rampla||d.n);d.truck.userData.plate.material.map=plateTex(o.tractor||'');placeTruck(d,1)}
      return}
    if(d.shown!==busy)drive(d)});
  dirty=true}
setInterval(()=>{if(el.isConnected)docks.forEach(d=>{const o=ocupante(d.n);drawTag(d,o);if(o)setSem(d,semOf(o))})},20000);

/* ---------- vistas e interacción ---------- */
// [posición de cámara relativa al punto mirado, punto mirado]
const VIEWS={'3/4':[[16,15,36],TARGET],'Frontal':[[0,13,40],TARGET],'Aérea':[[0,122,8],TARGET_TOP],'Lateral':[[38,10,22],TARGET],'Lado B':[[-16,15,-36],TARGET_B]};
let fitK=1,camAnim=null;
function goView(name,instant){const [v,tg]=VIEWS[name],to=new THREE.Vector3(v[0],v[1],v[2]).multiplyScalar(fitK).add(tg);
  if(instant||RM){camera.position.copy(to);controls.target.copy(tg);controls.update();dirty=true;return}
  const from=camera.position.clone(),tf=controls.target.clone();camAnim=1;
  tween(1100,k=>{const e=ease(k);camera.position.lerpVectors(from,to,e);controls.target.lerpVectors(tf,tg,e);controls.update()}).then(()=>camAnim=null);
  bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.textContent===name))}
const controls=new OrbitControls(camera,renderer.domElement);
Object.assign(controls,{enableDamping:true,dampingFactor:.08,enablePan:false,minDistance:14,maxDistance:175,minPolarAngle:.05,maxPolarAngle:1.38});
controls.target.copy(TARGET);
if(!FINE){controls.enabled=false;renderer.domElement.style.touchAction='pan-y'} // en celular no bloquea el scroll
controls.addEventListener('change',()=>dirty=true);
const bar=document.createElement('div');bar.className='s3bar';
Object.keys(VIEWS).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;b.onclick=e=>{e.stopPropagation();goView(k)};bar.appendChild(b)});
el.appendChild(bar);docks.forEach(d=>el.appendChild(d.tag));
const cnt=document.createElement('div');cnt.className='s3count';el.appendChild(cnt);
const hint=document.createElement('div');hint.className='s3hint';hint.textContent=FINE?'Arrastre para girar · rueda para acercar · clic en un andén':'Toque un andén · cambie la vista arriba';el.appendChild(hint);

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(ev){const r=renderer.domElement.getBoundingClientRect();ndc.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const objs=[...docks.map(d=>d.hit),...docks.filter(d=>d.truck&&d.truck.visible).map(d=>d.truck)];
  for(const h of ray.intersectObjects(objs,true)){let o=h.object;while(o){if(o.userData.dock)return o.userData.dock;const dd=docks.find(d=>d.truck===o);if(dd)return dd.n;o=o.parent}}
  return 0}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(mv>8)return;const n=pick(e);if(n)openDoor(n)});
if(FINE){let hov=0;renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons)return;const n=pick(e);if(n!==hov){hov=n;renderer.domElement.style.cursor=n?'pointer':'grab';docks.forEach(d=>d.tag.classList.toggle('hov',d.n===n))}})}

/* ---------- tamaño y bucle ---------- */
function resize(){const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;
  fitK=Math.max(1,1.55/camera.aspect);camera.updateProjectionMatrix();let on=bar.querySelector('.on');if(!on){on=[...bar.children].find(b=>b.textContent===(w<700?'Frontal':'3/4'));on.classList.add('on')}
  if(!camAnim)goView(on.textContent,true);dirty=true}
new ResizeObserver(resize).observe(el);
renderer.setAnimationLoop(now=>{
  if(!el.isConnected||document.hidden)return;
  for(const t of tweens){const k=Math.min(1,(now-t.t0)/t.ms);t.fn(k);if(k>=1){tweens.delete(t);t.r()}}
  docks.forEach(d=>{if(d.moving&&d.truck)d.truck.userData.amber.emissiveIntensity=(Math.floor(now/380)%2)?3:.2});
  const moving=controls.update()||tweens.size>0||docks.some(d=>d.moving);
  if(moving||dirty){renderer.render(scene,camera);placeTags();dirty=false}});

window.Dock3D={el,paint};
mountScene(); // reemplaza la foto si el panel ya está en pantalla
})();
</script>
